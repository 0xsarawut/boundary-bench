[project]
# Distribution name must equal the import package name: inspect_ai derives the
# task namespace ("boundarybench/<task>") from the installed distribution that
# owns the package, and drops the prefix entirely when the names differ.
name = "boundarybench"
version = "0.1.0"
description = "BoundaryBench: benchmark coding-agent harnesses on Terminal-Bench tasks under hardened (NIST-derived) sandbox policies. Inspect AI + Harbor compatible."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.28",
  "inspect-ai>=0.3.234",
  "pyyaml>=6.0",
  # Auto-load ./.env for `boundarybench run` (already in the tree via inspect-ai;
  # pinned explicitly so the CLI's dotenv loading has a declared dependency).
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.11",
]
harbor = [
  "inspect-harbor>=0.5.7; python_version >= '3.12'",
  # Terminus-2 upstream runtime, pinned exactly: the controller import surface
  # must match the in-sandbox install from
  # harness/runtime/harbor_terminus_2/requirements.lock and the adapter's
  # HARBOR_VERSION integrity check (tests/test_harness_terminus_2.py guards
  # all four against drift). Update per runtime/harbor_terminus_2/UPSTREAM.md.
  "harbor==0.13.1; python_version >= '3.12'",
]
daytona = [
  "daytona-sdk>=0.187.0",
  # Inspect's openrouter provider needs the openai client to initialize the
  # model (we label the eval with the real model even though Claude Code, not
  # Inspect, makes the calls).
  "openai>=1.0",
]

[project.scripts]
boundarybench = "boundarybench.cli:main"

[project.entry-points.inspect_ai]
boundarybench = "boundarybench._registry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boundarybench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live_e2e: live Daytona/OpenRouter tests that are skipped unless explicitly enabled",
]
