        unsupported_features:
          - surface: full_mac_enforcement
            reason: usnistgov/linux_security includes SELinux/AppArmor-oriented controls outside Daytona v1 MAC capabilities.
            missing_surface: SELinux/AppArmor policy compiler and runtime proof
            verification_hint: Keep MAC controls unsupported until the runtime target can configure and prove them.
          - surface: full_auditd_compliance_evidence
            reason: The catalog can compile hardening fields but cannot collect auditd evidence or assessment records.
