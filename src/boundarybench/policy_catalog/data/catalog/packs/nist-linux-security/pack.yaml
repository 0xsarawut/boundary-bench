          - Intentionally less restrictive than the High profile where the Medium baseline selects fewer control enhancements.
          - Only enforced mappings targeting daytona-hardening-v1 compile into Daytona v1 hardening fields.
          - AgentSH contributes catalog coverage for argument-aware command restrictions and operation-specific read/write path rules; the Terminal-Bench runner installs the operation-specific session policy, while standalone real AgentSH preflight probes AgentSH-owned rules.
          - Live Daytona evidence collection remains outside this catalog package.
        metadata:
          source_policy_id: nist-linux-80053-high-derived
          source_variant_id: high-derived-daytona-contract-v1
          policy_label: NIST-derived Medium benchmark policy
